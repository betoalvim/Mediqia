<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .soft-shadow {
            box-shadow: 0px 4px 20px rgba(30, 41, 59, 0.04);
        }
        .btn-interaction:active {
            transform: scale(0.96);
            transition: transform 0.1s ease-out;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Hero/Header Visual Context -->
<div class="relative w-full h-[221px] overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container/20 to-transparent z-0"></div>
<div class="absolute top-0 left-0 w-full p-md flex flex-col justify-end h-full z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">VitalFlow</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Comece sua jornada de saúde inteligente hoje.</p>
</div>
<!-- Animated Background Element -->
<div class="absolute -right-20 -top-20 w-64 h-64 bg-primary-container/30 rounded-full blur-3xl animate-pulse"></div>
</div>
<!-- Main Content Area: Sign Up Form -->
<main class="flex-1 w-full max-w-md mx-auto bg-surface-container-lowest rounded-t-xl px-md pt-lg pb-xl soft-shadow -mt-6 relative z-20">
<header class="mb-lg">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface mb-xs">Criar Conta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Preencha seus dados para começar.</p>
</header>
<form class="space-y-sm" onsubmit="return false;">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="name">Nome Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT pl-11 pr-md py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" id="name" placeholder="Ex: João Silva" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT pl-11 pr-md py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" id="email" placeholder="joao@vitalflow.com" type="email"/>
</div>
</div>
<!-- CPF (Transactional requirement for medical/wellness apps in BR) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="cpf">CPF</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">fingerprint</span>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT pl-11 pr-md py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" id="cpf" placeholder="000.000.000-00" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-DEFAULT pl-11 pr-12 py-sm font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-md">
<button class="w-full py-sm bg-primary-container text-on-primary-container font-label-md text-headline-sm rounded-full btn-interaction transition-transform shadow-lg shadow-primary-container/20" type="submit">
                    Criar Conta
                </button>
</div>
</form>
<!-- Social Login Section -->
<div class="mt-xl">
<div class="relative flex items-center mb-lg">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink mx-md font-label-sm text-label-sm text-outline-variant">OU CADASTRE-SE COM</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs py-sm border border-surface-variant rounded-full font-label-md text-on-surface hover:bg-surface-container transition-colors btn-interaction">
<img alt="Google Logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8-vU8tA0IIPIyJT4a2Cqf6NxUMm1zDmvzgEnMt6L7JjVGn7dfIi9j35TnDqyXEQRN-OFAMoxOeZDntNnbgHAW1_NdX23Ffr2Mwmso-_3fnPXcAUWwf32EJYAzi0Lj5ORakFmIGHdt00NPG-aLH5WWIySQ6vryN2aas0A1f4mvjZujxF38l32Z_KM8JcFJAniTJGwwuZQjnXtNWoBkCjkCtBe662Q7PwMJHBFbIs9EQ1fkZan6LmfS7FSUKQduwbHi__8m1ppK_Yhz"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-xs py-sm border border-surface-variant rounded-full font-label-md text-on-surface hover:bg-surface-container transition-colors btn-interaction">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">apps</span>
                    Apple
                </button>
</div>
</div>
<!-- Footer Link -->
<footer class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Já tem uma conta? 
                <a class="text-primary font-label-md hover:underline transition-all" href="#">Faça Login</a>
</p>
</footer>
</main>
<!-- Decorative Bottom Gradient for Depth -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background to-transparent pointer-events-none -z-10"></div>
<script>
        // Simple Interaction logic for demo
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.type === 'submit') {
                    console.log('Account creation triggered');
                }
            });
        });

        // Password visibility toggle simulation
        const togglePass = document.querySelector('button .material-symbols-outlined:contains("visibility")');
        if(togglePass) {
            togglePass.parentElement.addEventListener('click', () => {
                const input = document.getElementById('password');
                const isPass = input.type === 'password';
                input.type = isPass ? 'text' : 'password';
                togglePass.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body></html>
