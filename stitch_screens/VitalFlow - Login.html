<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>

                    "surface-container-high": "#e6e8ea",
                    "on-error": "#ffffff",

                    "outline": "#727a64",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#e1e0ff",
                    "on-secondary-fixed-variant": "#3c475a",
                    "on-primary-fixed": "#121f00",
                    "surface-container": "#eceef0",
                    "on-primary-container": "#416400",
                    "surface-tint": "#446900",
                    "primary": "#446900",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#98da27",
                    "tertiary-container": "#ceceff",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#586377",

<style>
        body {
            background-color: #f7f9fb;
            font-family: 'Manrope', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-background {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-md">
<!-- Atmospheric Shader Background -->

<!-- Content Container -->
<main class="w-full max-w-[440px] flex flex-col items-center gap-xl relative z-10">
<!-- Brand Logo Area -->
<div class="flex flex-col items-center gap-xs">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center shadow-[0_10px_30px_rgba(30,41,59,0.08)] mb-xs">
<span class="material-symbols-outlined text-[48px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    vital_signs
                </span>
</div>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">VitalFlow</h1>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-lg shadow-[0_4px_20px_rgba(30,41,59,0.04)]">
<header class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Bem-vindo de volta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Entre com seus dados para continuar cuidando da sua saúde.</p>
</header>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Input Group: Email/CPF -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="user_identity">E-mail ou CPF</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-low border-none rounded-[16px] font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" id="user_identity" placeholder="Digite seu e-mail ou CPF" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Senha</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-xl pr-xl py-md bg-surface-container-low border-none rounded-[16px] font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass_icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-xs w-full bg-primary-container text-on-primary-container font-label-md text-headline-sm h-14 rounded-full shadow-[0_10px_30px_rgba(163,230,53,0.2)] active:scale-95 transition-all duration-200 hover:brightness-105 flex items-center justify-center gap-xs" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<div class="mt-lg flex items-center gap-md">
<div class="h-px flex-1 bg-surface-variant"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OU</span>
<div class="h-px flex-1 bg-surface-variant"></div>
</div>
<!-- Social Login / Secondary Path -->
<button class="mt-lg w-full flex items-center justify-center gap-sm py-md px-lg border-2 border-surface-variant rounded-full font-label-md text-on-surface hover:bg-surface-container transition-colors">
<img alt="Google" class="w-5 h-5 opacity-80" data-alt="A macro close-up of a high-tech crystal-like surface reflecting light in vibrant primary colors. The lighting is soft and diffused, creating a professional and clean medical-grade aesthetic. The background is a crisp clinic white with subtle depth and soft focus. The overall atmosphere is trustworthy, precise, and technologically advanced." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCENMREMjEguc6lO-QW63S9R7bM9FCjsYuf70eGvv_K9k1VZF4fgWHGWOBOi_8TJqvq_RzACXyviIVro6d7K89zohXQrfhHKO_DrZdPWAseGLag5dXZFG2mcx61AdaVM6gShOgHK3wQxGaVV15Qt-Ba-i97zqpeLI7-Mn5XA7q6vgn-XJTi9j0lJWqPHBDwBBGnkO1g3071pwfavZ3Q3w05ZDvQ4GeceBlUWOPPiMc48V0d-dK9qS-Tt1VObtt9MOZprZnr0UxxKgcF"/>
                Entrar com o Google
            </button>
</div>
<!-- Footer / Registration Path -->
<p class="font-body-md text-body-md text-on-surface-variant text-center">
            Não tem uma conta? 
            <a class="text-primary font-label-md hover:underline" href="#">Crie agora mesmo</a>
</p>
<!-- Aesthetic Trust Elements -->
<div class="mt-xs flex items-center gap-md opacity-40 grayscale group hover:grayscale-0 transition-all duration-500">
<span class="material-symbols-outlined text-[32px]">verified_user</span>
<span class="material-symbols-outlined text-[32px]">shield_lock</span>
<span class="material-symbols-outlined text-[32px]">health_and_safety</span>
</div>
</main>
<!-- Support Link Floating -->
<div class="fixed bottom-lg right-lg hidden md:block">
<button class="w-14 h-14 bg-surface-container-highest rounded-full flex items-center justify-center text-on-surface-variant shadow-lg hover:bg-primary-container hover:text-on-primary-container transition-all">
<span class="material-symbols-outlined">support_agent</span>
</button>
</div>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass_icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add subtle animation to the card on load
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('main');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.6s cubic-bezier(0.23, 1, 0.32, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
